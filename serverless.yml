# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: rpiaggio
service: meal

provider:
  name: aws
  runtime: java21
  region: us-west-2
  stage: dev
  timeout: 29

package:
  artifact: target/out/jvm/scala-3.10.0/meal/meal.jar

functions:
  api:
    handler: com.rpiaggio.meal.Main$EntryPoint::handleRequest
    events:
      - http:
          path: "{proxy+}"
          method: get
          cors: true
